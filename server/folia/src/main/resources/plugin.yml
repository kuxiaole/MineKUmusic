name: MineKUmusic
version: '${version}'
main: me.sorihiko.dango.server.folia.DangoMusicFolia
api-version: '26.1.2'
folia-supported: true
softdepend: [Vault, VaultUnlocked, ServiceIO, XConomy]
description: Server music for MineKU Music, based on DangoMusic with AllMusic as a server design reference
authors: ["\u5c0f\u4e50 (MineKUmusic)", "Sorihiko (DangoMusic)"]
commands:
  minekumusic:
    aliases: [music, kum]
    description: 全服音乐帮助、点歌、队列管理与配置重载
    usage: /minekumusic help
permissions:
  dangomusic.use:
    default: true
  dangomusic.request:
    default: true
  dangomusic.vote:
    default: true
  dangomusic.admin:
    default: op
